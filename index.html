<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171117">
<title>منوی آنلاین کافه پینک</title>

<style>
:root {
  --pink: #ff72b6;
  --dark: #171117;
  --card: #251d25;
  --muted: #c9bdc7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--dark);
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
}

header {
  padding: 32px 15px 25px;
  text-align: center;
  background: linear-gradient(145deg, #442239, #171117);
  border-bottom: 2px solid var(--pink);
}

.logo {
  color: var(--pink);
  font-size: 36px;
  font-weight: bold;
}

header p {
  color: #eee;
  font-size: 13px;
}

.search {
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--dark);
}

.search input {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--pink);
  border-radius: 12px;
  background: var(--card);
  color: white;
  font-size: 15px;
}

.categories {
  display: flex;
  gap: 8px;
  padding: 0 14px 12px;
  overflow-x: auto;
}

.categories button {
  flex-shrink: 0;
  border: 1px solid var(--pink);
  border-radius: 22px;
  padding: 10px 14px;
  background: var(--card);
  color: white;
  font-size: 13px;
}

.categories button.active {
  background: var(--pink);
  color: #23131d;
  font-weight: bold;
}

h2 {
  margin: 20px 15px 10px;
  color: var(--pink);
  font-size: 20px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
}

.item {
  min-width: 0;
  overflow: hidden;
  background: var(--card);
  border: 1px solid #44313f;
  border-radius: 14px;
}

.item img {
  display: block;
  width: 100%;
  height: 130px;
  object-fit: cover;
  background: #332632;
}

.item-info {
  padding: 12px;
}

.item h3 {
  font-size: 14px;
  line-height: 1.8;
  margin: 0 0 7px;
}

.price {
  color: var(--pink);
  font-size: 13px;
  font-weight: bold;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

footer {
  text-align: center;
  padding: 30px 10px;
  color: var(--pink);
  font-size: 13px;
}

@media (min-width: 650px) {
  .menu {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    max-width: 1000px;
    margin: auto;
  }

  .categories {
    justify-content: center;
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">کافه پینک 🩷</div>
  <p>یه جرعه آرامش، یه دنیا حال خوب!</p>
</header>

<div class="search">
  <input
    id="search"
    type="search"
    placeholder="🔍 اسم نوشیدنی یا خوراکی..."
    autocomplete="off"
  >
</div>

<nav class="categories" id="categories"></nav>

<h2 id="sectionTitle">منوی کافه</h2>

<main class="menu" id="menu"></main>

<footer>
  با عشق از کافه پینک 🩷
</footer>

<script>
/*

  قیمت صفر یعنی قیمت هنوز ثبت نشده است.
*/

const products = [

  // قهوه گرم
  {name:"اسپرسو", {
  name: "آیس موکا",
  category: "قهوه سرد",
  price: 0,
  image: "images/americano.jpg"
  }category:"قهوه گرم"},
  {name:"آمریکانو", category:"قهوه گرم"},
  {name:"کاپوچینو", category:"قهوه گرم"},
  {name:"لاته", category:"قهوه گرم"},
  {name:"بیسکو لاته", category:"قهوه گرم"},
  {name:"نوتلا لاته", category:"قهوه گرم"},
  {name:"لوتوس لاته", category:"قهوه گرم"},
  {name:"لاته دارچین", category:"قهوه گرم"},
  {name:"کارامل ماکیاتو", category:"قهوه گرم"},
  {name:"موکا", category:"قهوه گرم"},
  {name:"وایت موکا", category:"قهوه گرم"},
  {name:"شیر نسکافه", category:"قهوه گرم"},
  {name:"اسپرسو رومانو", category:"قهوه گرم"},

  // قهوه سرد
  {name:"کن هیلو", category:"قهوه سرد"},
  {name:"آیس کافی", category:"قهوه سرد"},
  {name:"آیس آمریکانو", category:"قهوه سرد"},
  {name:"آیس موکا", category:"قهوه سرد"},
  {name:"هایپر انرژی", category:"قهوه سرد"},
  {name:"آیس کارامل", category:"قهوه سرد"},
  {name:"آیس لاته فندقی", category:"قهوه سرد"},
  {name:"اورنج آمریکانو", category:"قهوه سرد"},
  {name:"آفوگاتو", category:"قهوه سرد"},

  // نوشیدنی گرم
  {name:"هات چاکلت", category:"نوشیدنی گرم"},
  {name:"وایت چاکلت", category:"نوشیدنی گرم"},
  {name:"پینک چاکلت", category:"نوشیدنی گرم"},
  {name:"شیر نسکافه", category:"نوشیدنی گرم"},
  {name:"ماسالا", category:"نوشیدنی گرم"},
  {name:"چای لاته", category:"نوشیدنی گرم"},
  {name:"شیر کاکائو", category:"نوشیدنی گرم"},
  {name:"شیر توت‌فرنگی", category:"نوشیدنی گرم"},
  {name:"چای نعنا", category:"نوشیدنی گرم"},
  {name:"شیر لوتوس", category:"نوشیدنی گرم"},
  {name:"چای زعفرانی", category:"نوشیدنی گرم"},
  {name:"پاپس چاکلت", category:"نوشیدنی گرم"},
  {name:"شیر نوتلا", category:"نوشیدنی گرم"},
  {name:"مارشمالو پینک چاکلت", category:"نوشیدنی گرم"},

  // شیک
  {name:"شیک شکلات", category:"شیک"},
  {name:"شیک نوتلا", category:"شیک"},
  {name:"شیک توت‌فرنگی", category:"شیک"},
  {name:"شیک لوتوس", category:"شیک"},

  {name:"شیک انبه", category:"شیک"},
  {name:"شیک پروتئین", category:"شیک"},
  {name:"شیر موز", category:"شیک"},

  // ماچا
  {name:"ماچا لاته", category:"ماچا"},
  {name:"ماچا پسته", category:"ماچا"},
  {name:"ماچا لوتوس", category:"ماچا"},

  {name:"اسپیرولینا", category:"ماچا"},

  // ساندویچ سرد و خوراکی
  {name:"ساندویچ سرد", category:"ساندویچ سرد"},
  {name:"پاستا", category:"ساندویچ سرد"},
  {name:"اسنک", category:"ساندویچ سرد"},
  {name:"سیب‌زمینی سرخ‌کرده", category:"ساندویچ سرد"},

  // کیک و دسر
  {name:"کیک خیس شکلات", category:"کیک و دسر"},
  {name:"کیک خانگی", category:"کیک و دسر"},
  {name:"چیزکیک", category:"کیک و دسر"},
  {name:"براونی", category:"کیک و دسر"},
  {name:"تیرامیسو", category:"کیک و دسر"},
  {name:"کوکی", category:"کیک و دسر"},
  {name:"موچی", category:"کیک و دسر"},
  {name:"کیک خامه‌ای", category:"کیک و دسر"},

  // نوشیدنی سرد
  {name:"شیر موز", category:"نوشیدنی سرد"},
  {name:"شیر موز بستنی", category:"نوشیدنی سرد"},
  {name:"شیر کاکائو", category:"نوشیدنی سرد"},
  {name:"شیر پسته", category:"نوشیدنی سرد"},
  {name:"لیموناد", category:"نوشیدنی سرد"},
  {name:"موهیتو", category:"نوشیدنی سرد"},
  {name:"رد موهیتو", category:"نوشیدنی سرد"},
  {name:"بلک موهیتو", category:"نوشیدنی سرد"},
  {name:"آب هویج ", category:"نوشیدنی سرد"},
  {name:"آب هویج بستنی ", category:"نوشیدنی سرد"},

  // بابل تی
  {name:"بابل تی کاراملی", category:"بابل تی"},
  {name:"بابل تی دالگونا", category:"بابل تی"},
  {name:"بابل تی شکلاتی", category:"بابل تی"}

].map(p => ({
  price: 0,
  image: "",
  ...p
}));

const categoryList = [
  "همه",
  "قهوه گرم",
  "قهوه سرد",
  "نوشیدنی گرم",
  "شیک",
  "ماچا",
  "ساندویچ سرد",
  "کیک و دسر",
  "نوشیدنی سرد",
  "بابل تی"
];

let selectedCategory = "همه";

const menu = document.getElementById("menu");
const search = document.getElementById("search");
const categories = document.getElementById("categories");
const sectionTitle = document.getElementById("sectionTitle");

function createCategories() {
  categoryList.forEach(category => {
    const button = document.createElement("button");
    button.textContent = category;

    if (category === selectedCategory) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      selectedCategory = category;

      document.querySelectorAll(".categories button")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
      renderMenu();
    });

    categories.appendChild(button);
  });
}

function renderMenu() {
  menu.replaceChildren();

  const query = search.value.trim().toLocaleLowerCase("fa");

  const filtered = products.filter(product => {
    const categoryMatch =
      selectedCategory === "همه" ||
      product.category === selectedCategory;

    const searchMatch =
      product.name.toLocaleLowerCase("fa").includes(query);

    return categoryMatch && searchMatch;
  });

  sectionTitle.textContent =
    selectedCategory === "همه"
      ? "منوی کافه"
      : selectedCategory;

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "محصولی پیدا نشد 🩷";
    menu.appendChild(empty);
    return;
  }

  filtered.forEach(product => {
    const card = document.createElement("article");
    card.className = "item";

{
  const img = document.createElement("img");

  img.src = product.image ||
    "https://loremflickr.com/400/300/" +
    encodeURIComponent(product.name);

  img.alt = product.name;
  img.loading = "lazy";

  img.onerror = function () {
    this.style.display = "none";
  };

  card.appendChild(img);
}

    const info = document.createElement("div");
    info.className = "item-info";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const price = document.createElement("div");
    price.className = "price";

    price.textContent = product.price > 0
      ? product.price.toLocaleString("fa-IR") + " تومان"
      : "قیمت به‌زودی";

    info.append(title, price);
    card.appendChild(info);
    menu.appendChild(card);
  });
}

search.addEventListener("input", renderMenu);

createCategories();
renderMenu();
</script>

</body>
</html>
