<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منوی کافه پینک</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111111;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

header {
    text-align: center;
    padding: 30px 15px 20px;
    background: linear-gradient(135deg, #21131b, #111111);
    border-bottom: 2px solid #ff69b4;
}

.logo {
    color: #ff69b4;
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 10px;
}

header p {
    color: #dddddd;
    font-size: 13px;
}

.search-box {
    padding: 15px;
}

.search-box input {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #ff69b4;
    background: #202020;
    color: white;
    font-size: 14px;
    outline: none;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 5px 15px 15px;
}

.categories button {
    flex-shrink: 0;
    padding: 10px 15px;
    border: 1px solid #ff69b4;
    background: #202020;
    color: white;
    border-radius: 20px;
    cursor: pointer;
}

.categories button.active,
.categories button:hover {
    background: #ff69b4;
    color: #111111;
}

h2 {
    color: #ff69b4;
    font-size: 20px;
    padding: 0 15px;
    margin-top: 20px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
}

.item {
    background: #202020;
    border: 1px solid #353535;
    border-radius: 14px;
    overflow: hidden;
    min-width: 0;
}

.item img {
    width: 100%;
    height: 125px;
    object-fit: cover;
    display: block;
}

.item-info {
    padding: 12px;
}

.item h3 {
    font-size: 14px;
    margin: 0 0 10px;
    line-height: 1.8;
}

.price {
    color: #ff69b4;
    font-size: 14px;
    font-weight: bold;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #cccccc;
    padding: 25px 10px;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #ff69b4;
    font-size: 13px;
}

@media (min-width: 600px) {
    .menu {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 950px;
        margin: auto;
    }

    .categories {
        justify-content: center;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">کافه پینک 🩷</div>
    <p>یه جرعه آرامش، یه دنیا حال خوب!</p>
</header>

<div class="search-box">
    <input
        type="search"
        id="search"
        placeholder="🔍 اسم نوشیدنی یا خوراکی رو بنویس..."
        oninput="renderMenu()"
    >
</div>

<nav class="categories" id="categories">
    <button class="active" onclick="setCategory('همه', this)">همه</button>
    <button onclick="setCategory('گرم', this)">نوشیدنی گرم ☕</button>
    <button onclick="setCategory('سرد', this)">نوشیدنی سرد 🧋</button>
    <button onclick="setCategory('خوراکی', this)">خوراکی‌ها 🍰</button>
</nav>

<h2 id="sectionTitle">منوی کافه</h2>

<main class="menu" id="menu"></main>

<footer>
    با عشق از کافه پینک 🩷
</footer>

<script>
const products = [

    // نوشیدنی‌های گرم
    {
        name: "اسپرسو رومانو",
        category: "گرم",
        price: 0,
        image: ""
    },
    {
        name: "چای لاته",
        category: "گرم",
        price: 0,
        image: ""
    },
    {
        name: "مارشمالو پینک چاکلت",
        category: "گرم",
        price: 0,
        image: ""
    },
    {
        name: "پاپس چاکلت",
        category: "گرم",
        price: 0,
        image: ""
    },

    // نوشیدنی‌های سرد
    {
        name: "آیس موکا",
        category: "سرد",
        price: 0,
        image: ""
    },
    {
        name: "شیر نوتلا",
        category: "سرد",
        price: 0,
        image: ""
    },
    {
        name: "بابل تی کاراملی",
        category: "سرد",
        price: 0,
        image: ""
    },
    {
        name: "شیر موز",
        category: "سرد",
        price: 0,
        image: ""
    },
    {
        name: "کن هیلو",
        category: "سرد",
        price: 0,
        image: ""
    },

    // خوراکی‌ها
    {
        name: "کیک خامه‌ای",
        category: "خوراکی",
        price: 0,
        image: ""
    },
    {
        name: "پاستا",
        category: "خوراکی",
        price: 0,
        image: ""
    },
    {
        name: "اسنک",
        category: "خوراکی",
        price: 0,
        image: ""
    },
    {
        name: "سیب‌زمینی سرخ‌کرده",
        category: "خوراکی",
        price: 0,
        image: ""
    }

];

let currentCategory = "همه";

function setCategory(category, button) {
    currentCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderMenu();
}

function renderMenu() {
    const menu = document.getElementById("menu");
    const search = document.getElementById("search")
        .value.trim().toLowerCase();

    menu.innerHTML = "";

    const filtered = products.filter(product => {
        const matchesCategory =
            currentCategory === "همه" ||
            product.category === currentCategory;

        const matchesSearch =
            product.name.toLowerCase().includes(search);

        return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
        menu.innerHTML =
            '<div class="empty">محصولی پیدا نشد 🩷</div>';
        return;
    }

    filtered.forEach(product => {
        const card = document.createElement("article");
        card.className = "item";

        if (product.image) {
            const img = document.createElement("img");
            img.src = product.image;
            img.alt = product.name;
            img.loading = "lazy";
            card.appendChild(img);
        }

        const info = document.createElement("div");
        info.className = "item-info";

        const title = document.createElement("h3");
        title.textContent = product.name;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = product.price > 0
            ? product.price.toLocaleString("fa-IR") + " تومان"
            : "قیمت به‌زودی";

        info.appendChild(title);
        info.appendChild(price);
        card.appendChild(info);
        menu.appendChild(card);
    });
}

renderMenu();
</script>

</body>
</html>
